services:
  jenkins:
    build: .
    container_name: notes-jenkins
    ports:
      # Bound to this machine only, so nobody else on the network can reach it.
      - '127.0.0.1:8080:8080'
    environment:
      JENKINS_ADMIN_ID: admin
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:-notes-lab-only}
    volumes:
      - jenkins_home:/var/jenkins_home

volumes:
  jenkins_home:
